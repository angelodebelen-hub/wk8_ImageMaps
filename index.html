<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Map Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Image Map Example</h1>
    <p>Click on the areas of the image below:</p>
    <img src="Bird-Island.jpeg" alt="Example Image" usemap="#image-map">

    <map name="image-map">
        <area shape="rect" title="Bird Island" coords="34,44,270,350" href="https://www.tripadvisor.com/Attraction_Review-g60716-d4867618-Reviews-Bird_Island-Saipan_Northern_Mariana_Islands.html" alt="Area 1">
        <area shape="circle" title="Bird Island" coords="500,150,75" href="https://www.tripadvisor.com/Attraction_Review-g60716-d4867618-Reviews-Bird_Island-Saipan_Northern_Mariana_Islands.html" alt="Area 2">
        <area shape="poly" title="Bird Island" coords="600,200,650,250,700,200,650,150" href="https://www.tripadvisor.com/Attraction_Review-g60716-d4867618-Reviews-Bird_Island-Saipan_Northern_Mariana_Islands.html" alt="Area 3">
    </map>
    
</body>
</html>
